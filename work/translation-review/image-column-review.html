<style>
#image-column-review { --r-bg:light-dark(#fff,#202632); --r-text:light-dark(#263247,#e5ebf5); --r-muted:light-dark(#596a82,#afbdd2); --r-line:light-dark(#d5dbe3,#465064); --r-soft:light-dark(#f5f7fa,#293242); --r-blue:light-dark(#245dd8,#9dbdff); color:var(--r-text); font:14px/1.5 system-ui,sans-serif; }
#image-column-review * { box-sizing:border-box; }
#image-column-review [hidden] { display:none; }
#image-column-review .r-window { background:var(--r-bg); border:1px solid var(--r-line); border-radius:10px; }
#image-column-review .r-fixed-head { position:sticky; top:0; z-index:5; background:var(--r-bg); border-radius:10px 10px 0 0; box-shadow:0 1px 0 var(--r-line); }
#image-column-review .r-top, #image-column-review .r-tools, #image-column-review .r-footer { padding:12px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; border-bottom:1px solid var(--r-line); }
#image-column-review .r-top strong { font-size:18px; font-weight:600; }
#image-column-review .r-count { color:var(--r-muted); font-size:12px; }
#image-column-review button, #image-column-review select, #image-column-review input[type=search] { font:inherit; color:inherit; background:var(--r-bg); border:1px solid var(--r-line); border-radius:5px; padding:6px 9px; max-width:100%; }
#image-column-review button, #image-column-review summary { cursor:pointer; }
#image-column-review .r-tools { justify-content:flex-end; gap:8px; margin-left:auto; padding:0; border:0; max-width:100%; }
#image-column-review .r-tools input { flex:0 1 230px; width:230px; min-width:130px; }
#image-column-review .r-spacer { margin-left:auto; }
#image-column-review .r-columns { display:grid; grid-template-columns:22px var(--image-width,140px) minmax(0,1fr) minmax(0,1.2fr); gap:12px; }
#image-column-review .r-columns > * { min-width:0; }
#image-column-review .r-thumb { padding:0; width:100%; height:64px; background:var(--r-soft); overflow:hidden; }
#image-column-review .r-thumb canvas { display:block; width:100%; height:100%; object-fit:contain; }
#image-column-review .r-enlarged { grid-column:2 / -1; padding:12px 14px; background:var(--r-soft); border:1px solid var(--r-line); border-radius:6px; }
#image-column-review .r-thumb[aria-expanded="true"] { border-color:var(--r-blue); }
#image-column-review .r-enlarged header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
#image-column-review .r-enlarged canvas { display:block; max-width:100%; height:auto; margin:auto; }
#image-column-review .r-head { background:var(--r-soft); padding:7px 16px; color:var(--r-muted); font-size:12px; }
#image-column-review .r-row { padding:var(--r-padding,10px) 16px; border-bottom:1px solid var(--r-line); }
#image-column-review .r-row input[type=checkbox] { margin:5px 0; accent-color:var(--r-blue); }
#image-column-review .r-meta { color:var(--r-muted); font-size:12px; margin-bottom:3px; }
#image-column-review .r-source { overflow-wrap:anywhere; }
#image-column-review textarea { width:100%; min-height:38px; font:inherit; color:inherit; background:var(--r-bg); border:1px solid var(--r-line); border-radius:5px; padding:6px 8px; resize:vertical; }
#image-column-review details { grid-column:3 / -1; color:var(--r-muted); font-size:12px; }
#image-column-review .r-detail { margin-top:4px; display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
#image-column-review .r-detail button { padding:3px 7px; font-size:12px; line-height:18px; min-height:26px; color:var(--r-muted); }
#image-column-review .r-footer { border:0; font-size:12px; }
#image-column-review .r-primary { background:light-dark(#245dd8,#9dbdff); color:light-dark(#fff,#10264b); border-color:transparent; }
#image-column-review .r-warning { color:light-dark(#885600,#ffd182); font-size:12px; }
#image-column-review .r-notice { padding:0 16px 10px; font-size:12px; color:var(--r-muted); }
@media(max-width:560px) { #image-column-review .r-columns { grid-template-columns:22px 90px minmax(0,1fr); gap:8px; } #image-column-review .r-translation { grid-column:3; } #image-column-review .r-head .r-ja { display:none; } #image-column-review .r-count { width:100%; } #image-column-review details { grid-column:2 / -1; } }
@media(pointer:coarse) { #image-column-review button, #image-column-review select, #image-column-review summary { min-height:44px; } #image-column-review textarea, #image-column-review input[type=search] { font-size:16px; } }
@media(pointer:coarse) { #image-column-review .r-detail button { min-height:44px; } }
</style>
<div id="image-column-review" aria-label="翻訳の一括確認・画像列を常時表示する案">
 <section class="r-window" aria-label="翻訳をまとめて確認">
  <div class="r-fixed-head">
  <header class="r-top"><strong>翻訳をまとめて確認</strong><span class="r-count">3枚・10領域 ／ 変更 10</span>
  <div class="r-tools"><select aria-label="カード"><option value="">すべてのカード</option><option>05-bridge.png</option><option>01-grove.png</option><option>02-cloud.png</option></select><select aria-label="表示条件"><option value="all">すべて</option><option value="issues">要確認</option></select><input type="search" placeholder="原文・訳文を検索" aria-label="原文・訳文を検索"></div>
  </header>
  <div class="r-head r-columns"><input id="r-all" type="checkbox" checked aria-label="表示中をすべて選択"><span>原画像 · クリックで拡大</span><span>カード・原文</span><span class="r-ja">日本語訳</span></div>
  </div>
  <section class="r-enlarged" hidden aria-label="拡大した原画像"><header><span id="r-image-title"></span><button type="button" id="r-image-close">拡大を閉じる</button></header><canvas id="r-large"></canvas></section>
  <div id="r-rows"></div>
  <footer class="r-footer"><span id="r-showing">10 / 10件</span><span class="r-spacer" id="r-selected" aria-live="polite"></span><button type="button" class="r-primary" id="r-apply">選択した変更を反映</button></footer>
  <div class="r-notice" id="r-status" role="status">サンプル表示・訳文は反映するまで未確定</div>
 </section>
</div>
<script>
(() => {
 const root = document.getElementById('image-column-review');
 const data = [
  ['名前','THE QUIET BRIDGE','静かな橋'],
  ['分類','EVENT','イベント'],
  ['種別','ONE USE','使い切り'],
  ['効果','All travelers may move 1 space. A traveler who stays in place gains 2 💧 instead. Discard this card.','すべての旅人は1マス移動してもよい。その場に留まった旅人は、代わりに💧を2つ得る。このカードを捨てる。'],
  ['名前','LANTERN GROVE','灯りの木立'],
  ['分類','PLACE','場所'],
  ['種別','FOREST / QUIET','森 / 静寂'],
  ['効果','When you enter this place, gain 2 ☀. Spend 1 💧: move one marker from this card to your reserve.','この場所に入ったとき、☀を2つ得る。💧を1つ消費：このカードのマーカー1つを自分のストックへ移す。'],
  ['名前','CLOUD COURIER','雲の配達人'],
  ['効果','AFTER MOVING — Draw 2 cards, then keep 1. If your reserve is empty, gain 1 ☀.','移動後：カードを2枚引き、そのうち1枚を残す。自分のストックが空なら、☀を1つ得る。']
 ];
 const cardNames=data.map((_,i)=>i<4?'05-bridge.png':i<8?'01-grove.png':'02-cloud.png');
 const rows = root.querySelector('#r-rows');
 data.forEach((item,i) => {
  const row=document.createElement('article'); row.className='r-row r-columns'; row.dataset.issue=String(Boolean(item[3]));
  row.innerHTML='<input type="checkbox" checked aria-label="'+item[0]+'の翻訳を選択"><button type="button" class="r-thumb" data-image="'+i+'" aria-label="'+item[0]+'の原画像を拡大"><canvas role="img" aria-label="'+item[0]+'の原画像"></canvas></button><div class="r-source"><div class="r-meta">05-bridge.png · '+item[0]+'</div>'+item[1]+'</div><div class="r-translation"><textarea rows="'+(i>2?4:1)+'" aria-label="'+item[0]+'の日本語訳">'+item[2]+'</textarea></div><details><summary>補助操作</summary><div class="r-detail"><button type="button">カード上で確認</button><button type="button">訳を再利用</button><button type="button">＋ アセット</button></div></details>';
  row.querySelector('.r-translation').appendChild(row.querySelector('.r-detail'));
  row.querySelector('details').remove();
  row.querySelector('.r-meta').textContent=cardNames[i]+' · '+item[0];
  row.dataset.card=cardNames[i];
  row.querySelector('textarea').rows=item[0]==='効果'?4:1;
  row.querySelector('.r-thumb').setAttribute('aria-expanded','false');
  row.querySelector('.r-thumb').setAttribute('aria-controls','r-inline-image');
  rows.appendChild(row);
 });

 root.querySelector('#r-all').onchange=e=>{ rows.querySelectorAll('article').forEach(r=>{if(!r.hidden)r.querySelector('input').checked=e.target.checked;}); count(); };
 rows.addEventListener('change',count);
 function filter() {const q=root.querySelector('input[type=search]').value.toLowerCase(); const card=root.querySelector('[aria-label="カード"]').value;const issues=root.querySelector('[aria-label="表示条件"]').value==='issues'; rows.querySelectorAll('article').forEach(r=>{r.hidden=!(r.textContent+r.querySelector('textarea').value).toLowerCase().includes(q)||(issues&&r.dataset.issue!=='true')||(card&&r.dataset.card!==card);}); root.querySelector('#r-showing').textContent=rows.querySelectorAll('article:not([hidden])').length+' / '+data.length+'件';}
 root.querySelector('[aria-label="カード"]').onchange=filter;
 root.querySelector('input[type=search]').oninput=filter; root.querySelector('[aria-label="表示条件"]').onchange=filter;
 root.querySelector('#r-apply').onclick=()=>root.querySelector('#r-status').textContent='モックのため反映は行いません。';

 const grove=new Image(),cloud=new Image();
 const crops=[[44,65,420,43],[44,121,92,26],[44,150,95,24],[46,616,635,133],[44,65,350,43],[44,121,85,26],[44,150,185,24],[46,616,635,133],[44,65,350,43],[46,616,635,133]];

 let imageTrigger=null;
 const imagePanel=root.querySelector('.r-enlarged');
 imagePanel.id='r-inline-image';
 rows.addEventListener('click',e=>{
  const button=e.target.closest('button');
  if(!button||button.id==='r-image-close')return;
  if(button.dataset.image===undefined){root.querySelector('#r-status').textContent='補助操作の配置イメージです。';return;}
  if(imageTrigger===button&&!imagePanel.hidden){closeImage();return;}
  const row=button.closest('.r-row');
  const previousTop=row.getBoundingClientRect().top;
  imageTrigger?.setAttribute('aria-expanded','false');
  imageTrigger=button;
  const index=Number(button.dataset.image);
  row.appendChild(imagePanel);
  paint(root.querySelector('#r-large'),index);
  root.querySelector('#r-image-title').textContent=data[index][0]+' · '+cardNames[index];
  imagePanel.hidden=false;
  button.setAttribute('aria-expanded','true');
  button.focus({preventScroll:true});
  window.scrollBy(0,row.getBoundingClientRect().top-previousTop);
  const availableAbove=Math.max(0,row.getBoundingClientRect().top-root.querySelector('.r-fixed-head').getBoundingClientRect().bottom-8);
  const overflowBelow=Math.max(0,imagePanel.getBoundingClientRect().bottom-window.innerHeight+12);
  window.scrollBy(0,Math.min(availableAbove,overflowBelow));
 });
 function closeImage(){imagePanel.hidden=true;imageTrigger?.setAttribute('aria-expanded','false');imageTrigger?.focus({preventScroll:true});}
 root.querySelector('#r-image-close').onclick=closeImage;
 root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!root.querySelector('.r-enlarged').hidden)closeImage();});
 const state={spacing:'compact',width:140};
 function render(){root.style.setProperty('--image-width',state.width+'px');root.style.setProperty('--r-padding',state.spacing==='compact'?'10px':'18px');}
 render(); count(); filter();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(state,'width',{label:'画像列の幅',min:100,max:180,step:10,unit:'px'});tweak.addSelect(state,'spacing',{label:'行間',options:[{label:'コンパクト',value:'compact'},{label:'ゆったり',value:'relaxed'}]});}
})();
